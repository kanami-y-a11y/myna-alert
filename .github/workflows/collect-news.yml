name: Collect incidents and notify

on:
  schedule:
    # 毎日 8:00 JST (UTC 23:00 前日)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect and match incidents
        id: collect
        run: |
          python scripts/collect_news.py
          echo "changed=$?" >> $GITHUB_OUTPUT

      - name: Commit updated incidents.json
        if: steps.collect.outputs.changed == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "chore: update incident data [skip ci]"
          git push

      - name: Send email notification
        if: steps.collect.outputs.changed == '1' && env.GMAIL_USERNAME != ''
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "🚨 マイナ保険証 インシデント更新"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: マイナ保険証ウォッチ <${{ secrets.GMAIL_USERNAME }}>
          body: file://new_articles_summary.txt
          content_type: text/plain; charset=utf-8
