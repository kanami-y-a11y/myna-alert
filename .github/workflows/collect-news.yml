name: Collect news and notify

on:
  schedule:
    # 毎日 8:00, 13:00, 18:00 JST (= UTC 23:00, 04:00, 09:00)
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:  # 手動実行も可

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect news
        id: collect
        run: |
          python scripts/collect_news.py
          echo "new_found=$?" >> $GITHUB_OUTPUT

      - name: Commit updated articles.json
        if: steps.collect.outputs.new_found == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "chore: add new incident articles [skip ci]"
          git push

      - name: Send email notification
        if: steps.collect.outputs.new_found == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "🚨 マイナ保険証 新着インシデント"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: マイナ保険証ウォッチ <${{ secrets.GMAIL_USERNAME }}>
          body: file://new_articles_summary.txt
          content_type: text/plain; charset=utf-8
